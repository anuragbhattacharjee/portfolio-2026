name: Deploy portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://anuragbhattacharjee.github.io/
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check deployment credential
        id: deploy-credential
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$PAGES_DEPLOY_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Build passed, but deployment was skipped because PAGES_DEPLOY_TOKEN is not configured."
          fi

      - name: Check out GitHub Pages repository
        if: steps.deploy-credential.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          repository: anuragbhattacharjee/anuragbhattacharjee.github.io
          ref: master
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-site

      - name: Publish production build
        if: steps.deploy-credential.outputs.available == 'true'
        shell: bash
        run: |
          test -d pages-site/.git
          find pages-site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. pages-site/
          cd pages-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No deployment changes."
            exit 0
          fi
          git commit -m "Deploy portfolio ${GITHUB_SHA::7}"
          git push origin master
